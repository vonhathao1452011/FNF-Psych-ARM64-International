name: Build FNF Android International Full HD
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Global Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Core Libraries Installation
        run: |
          haxelib install flixel 4.11.0
          haxelib install lime 7.9.0
          haxelib install openfl 9.2.0
          haxelib run lime setup android
          haxelib run lime setup

      - name: Compile Full HD Optimized Production APK
        run: haxelib run lime build android -final

      - name: Publish Production Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-PsychEngine-International-HD-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
